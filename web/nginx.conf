server {
    listen 80;
    server_name _;

    # Docker 内嵌 DNS，只在 compose 的自定义网络里可达。
    #
    # 配合下面用变量写的 proxy_pass 一起用：nginx 在配置加载时就把
    # api 解析成 IP 并一直用下去，只重建 api 容器（它的 IP 会变）而不动 web，
    # 请求就会打到那个已经失效的地址上 —— 对外表现是 502，
    # 而 docker compose ps 里每个容器的健康检查都是绿的，很难查。
    # 写成变量形式后，nginx 按 valid 的间隔重新解析，这条链路就能自愈。
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # 后端单文件上限是 20 MiB（MAX_UPLOAD_BYTES）。
    # 这里必须放得比它宽，否则 20–100 MiB 的文件会在 nginx 层被拦下，
    # 用户看到的是 nginx 的 HTML 错误页，而不是后端返回的 JSON 提示。
    client_max_body_size 100m;
    client_body_timeout  120s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # 变量形式：不写 URI 部分，原始请求 URI 原样转发，与直写 upstream 时一致
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件上传与索引等待都可能超过默认的 60s
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 上传进度反馈依赖请求体不被整体缓冲，直接边收边转
        proxy_request_buffering off;
    }

    # 静态资源带指纹，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用：未命中的路径一律回退到 index.html，刷新子路由不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
