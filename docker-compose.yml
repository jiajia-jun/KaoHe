# 文件管理与知识检索平台 —— 本地部署编排
#
# 启动：cp .env.example .env && docker compose up --build
# 停止：docker compose down          （不要加 -v，-v 会连数据卷一起删除）
#
# 设计要点：
#   * 只暴露 web 一个宿主机端口，db/api/worker/embed 一律走 compose 内网。
#   * api 与 worker 是同一个镜像的两个 --mode，避免重复构建。
#   * embed 单独一个镜像：它要 Python 与 ONNX Runtime，和静态 Go 二进制的基础镜像不同。
#   * migrate 是一次性任务，api 与 worker 通过 service_completed_successfully 等它成功后才启动。
#   * 数据全部落在具名卷 pgdata / uploads 上，容器重建不影响数据。
#   * 日志绑定挂载到仓库下的 ./logs，三个角色各写一个文件（api.log / worker.log /
#     migrate.log）。绑定挂载而不是具名卷，是为了能直接在文件管理器里打开看。

name: kaohe

# 日志配置由三个角色共用，用锚点写一份、各处 <<: *log-env 引入。
#
# LOG_DIR 在这里显式设成 /data/logs：程序自己的默认值是「不落盘、只写 stdout」，
# 那样本机 go run / go test 不会在盘符根目录下凭空建出 /data/logs。
# 容器里要落盘，所以由 compose 明确打开。日志目录不可写时进程会拒绝启动 ——
# 宁可起不来，也不要一个看起来正常却永远不产生日志文件的进程。
#
# 宿主机一侧的目录用 LOG_HOST_DIR 覆盖（默认 ./logs）：文件名按角色固定，
# 因此**同时跑两套栈时两边必须指向不同的目录**，否则两个进程写同一个 api.log，
# 轮转（重命名 + 新建）会让它们各写各的、谁也轮转不动谁。
# scripts/clean_start_smoke.py 起第二套栈时就走这条路：
#     LOG_HOST_DIR=./logs-clean WEB_PORT=8091 docker compose -p kaoheclean up -d --build
x-logging-env: &log-env
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  # 只影响 stdout 的格式，文件恒为 JSON，所以名字里写明了是 console 的格式。
  LOG_CONSOLE_FORMAT: "${LOG_CONSOLE_FORMAT:-console}"
  LOG_DIR: /data/logs
  LOG_MAX_SIZE_MB: "${LOG_MAX_SIZE_MB:-32}"
  LOG_MAX_BACKUPS: "${LOG_MAX_BACKUPS:-5}"
  LOG_MAX_AGE_DAYS: "${LOG_MAX_AGE_DAYS:-30}"
  LOG_COMPRESS: "${LOG_COMPRESS:-false}"
  SLOW_REQUEST_MS: "${SLOW_REQUEST_MS:-500}"
  SLOW_TASK_MS: "${SLOW_TASK_MS:-5000}"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?未设置：请先执行 cp .env.example .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?未设置：请先执行 cp .env.example .env}
      POSTGRES_DB: ${POSTGRES_DB:?未设置：请先执行 cp .env.example .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用 $$ 转义，避免 compose 在宿主机侧提前展开变量
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [kaohe]

  # 一次性迁移任务：建扩展、建表、建索引。可重复执行，已应用的版本会跳过。
  migrate:
    image: kaohe-app
    build:
      context: .
    command: ["--mode=migrate"]
    environment:
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      <<: *log-env
    volumes:
      # migrate 本来不需要任何卷（迁移文件是 go:embed 编进二进制的），
      # 只有日志要落盘。它的日志反而是三个里最值得留的：一次性任务、restart: "no"、
      # 在任何东西启动之前就跑完，静默失败会让整个 stack 都起不来。
      - ${LOG_HOST_DIR:-./logs}:/data/logs
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [kaohe]

  # 向量边车：跑 bge-small-zh-v1.5 的 ONNX 推理，只对内网提供 /embed
  embed:
    build:
      context: ./services/embed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [kaohe]

  api:
    image: kaohe-app
    build:
      context: .
    command: ["--mode=api"]
    environment:
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      LISTEN_ADDR: ":8080"
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-20971520}"
      SEMANTIC_MIN_SCORE: "${SEMANTIC_MIN_SCORE:-0.5}"
      # 语义检索要把用户的描述转成查询向量。
      #
      # 这里刻意不依赖 embed 健康：文件管理与关键词检索都不需要它，
      # 用 depends_on 把 api 拦住，等于让一个可选能力决定整个平台能不能起来。
      # 边车没就绪时 api 照常提供其余功能，只有语义检索返回「服务暂不可用」。
      EMBED_URL: http://embed:8000
      <<: *log-env
    volumes:
      - uploads:/data/uploads
      - ${LOG_HOST_DIR:-./logs}:/data/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks: [kaohe]

  # 索引任务消费者。与 api 同一个镜像、同一份数据卷 ——
  # 它要读 api 落盘的原始文件才能抽取正文。
  worker:
    image: kaohe-app
    build:
      context: .
    command: ["--mode=worker"]
    environment:
      DATABASE_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      UPLOAD_DIR: /data/uploads
      EMBED_URL: http://embed:8000
      <<: *log-env
    volumes:
      - uploads:/data/uploads
      - ${LOG_HOST_DIR:-./logs}:/data/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      embed:
        # 等边车真的能应答再起：worker 启动时会先做一次健康检查，
        # 边车没就绪它会直接退出并重启，日志里会多出一串无意义的失败
        condition: service_healthy
    restart: unless-stopped
    networks: [kaohe]

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [kaohe]

volumes:
  pgdata:
  uploads:

networks:
  kaohe:
    driver: bridge
